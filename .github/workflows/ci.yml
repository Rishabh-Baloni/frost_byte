# This workflow installs dependencies in a venv and runs tests/lint
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up venv and install dependencies
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest
      - name: Lint with flake8
        run: |
          . venv/bin/activate
          flake8 .
      - name: Run tests (if any)
        run: |
          . venv/bin/activate
          if [ -d "tests" ]; then pytest; else echo "No tests directory"; fi
